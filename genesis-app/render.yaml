services:
  - type: web
    name: genesis-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Optional: add GROQ_API_KEY / TAVILY_API_KEY in Render dashboard for live mode.
      # Without keys the app runs in mock mode (full pipeline, canned providers).
