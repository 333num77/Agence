[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-validation-engine"
version = "0.2.0"
description = "AI-native idea validation engine: idea -> evidence -> verdict (VALIDATE / FIX_FIRST / REJECT). Web UI + CLI + Python SDK."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "validation", "evidence", "agents", "llm", "product"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
]

[project.scripts]
genesis = "app.cli:main"

[tool.setuptools]
packages = ["app", "app.agents", "app.api", "app.core", "app.orchestration", "app.providers", "app.store"]
